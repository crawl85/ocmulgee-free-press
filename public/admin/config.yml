            widget: list
            summary: "{{fields.title}} — {{fields.agency}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Agency, name: agency, widget: string }
              - { label: Category, name: category, widget: select, options: [ALPR / Surveillance, Contracts, Policies, Meeting Records, Correspondence, Spending, Other] }
              - { label: Date, name: date, widget: string }
              - { label: File format, name: format, widget: string }
              - { label: File size, name: size, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Upload record, name: file, widget: file }
      - name: resources
        label: Citizen Resources
        file: content/resources.json
        fields:
          - label: Resources
            name: resources
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Type, name: type, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Button text, name: action, widget: string }
      - name: authors
        label: Author Profiles
        file: content/authors.json
        fields:
          - label: Authors
            name: authors
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Profile slug, name: slug, widget: string, hint: "Lowercase words separated by hyphens" }
              - { label: Display name, name: name, widget: string }
              - label: Alternate bylines
                name: aliases
                widget: list
                required: false
                field: { label: Byline, name: byline, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Biography, name: bio, widget: text }
              - { label: Email, name: email, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Profile image, name: image, widget: image, required: false }
              - { label: Profile type, name: schemaType, widget: select, options: [Organization, Person], default: Organization }
      - name: settings
        label: Site Settings
        file: content/site.json
        fields:
          - { label: Publication name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Newsroom email, name: email, widget: string }
          - { label: Tips email, name: tipEmail, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: Edition, name: edition, widget: string }
